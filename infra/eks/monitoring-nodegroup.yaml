# EKS equivalent of the KIND "dedicated=monitoring" worker.
# The label+taint match dev/prometheus-values.yaml exactly, so the same Helm
# values pin the monitoring stack here with no changes.
#
#   eksctl create nodegroup -f infra/eks/monitoring-nodegroup.yaml
#
# Replace clusterName/region to match your environment.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: not-so-simple-platform
  region: us-east-1

managedNodeGroups:
  - name: monitoring
    instanceType: t3.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 50
    volumeType: gp3
    # Attracts the monitoring stack (matched by nodeSelector in the Helm values).
    labels:
      dedicated: monitoring
    # Repels everything else (matched by the tolerations in the Helm values).
    taints:
      - key: dedicated
        value: monitoring
        effect: NoSchedule
    # node-exporter still runs here because its DaemonSet tolerates all taints.

# NOTE for EKS persistence: install the EBS CSI driver and create a `gp3`
# StorageClass, then override storageClassName: gp3 in the Prometheus/Grafana/
# Alertmanager values (they default to `standard` for KIND).
