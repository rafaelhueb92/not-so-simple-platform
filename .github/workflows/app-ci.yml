name: CI/CD Pipeline - Task Manager

on:
  push:
    paths:
      - "app/**"
    branches: [master]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
    branches: [master]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy the deployed application resources"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY || secrets.AWS_ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY || secrets.AWS_ECR_REPOSITORY }}

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./app

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true'
    defaults:
      run:
        working-directory: ./app/src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check . --select E9,F63,F7,F82

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true'
    defaults:
      run:
        working-directory: ./app/src/tests
    strategy:
      matrix:
        #python-version: ["3.9", "3.10", "3.11"]
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest --verbose

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./app/src
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade safety bandit

      - name: Run Safety (Dependency Vulnerability Check)
        run: safety check

      - name: Run Bandit (Security Linting)
        run: bandit -r . || true

  #trivy:
  #  name: Trivy Scan
  #  runs-on: ubuntu-latest
  #  needs: [lint]
  #  if: github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true'
  #  steps:
  #    - name: Checkout code
  #      uses: actions/checkout@v4

  #    - name: Run Trivy vulnerability scanner (filesystem)
  #      uses: aquasecurity/trivy-action
  #      with:
  #        scan-type: fs
  #        scan-ref: app
  #        format: sarif
  #        output: trivy-fs-results.sarif
  #        severity: HIGH,CRITICAL
  #        exit-code: 1

  #    - name: Run Trivy vulnerability scanner (Dockerfile)
  #      uses: aquasecurity/trivy-action
  #      with:
  #        scan-type: config
  #        scan-ref: app/Dockerfile
  #        format: sarif
  #        output: trivy-config-results.sarif
  #        severity: HIGH,CRITICAL
  #        exit-code: 1

  # Build Docker Image
  destroy:
    name: Destroy Application
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy application resources
        env:
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "Destroy mode requested."
          IMAGE_TAGS=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" --query 'imageDetails[].imageTags[?@!=null] | []' --output json || true)
          if [ -n "$IMAGE_TAGS" ] && [ "$IMAGE_TAGS" != "[]" ]; then
            echo "$IMAGE_TAGS" | jq -r '.[][]' | while read -r tag; do
              aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" --image-ids imageTag="$tag" >/dev/null
            done
          fi
          echo "Deleted ECR images for repository $ECR_REPOSITORY"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security, trivy]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.destroy != 'true'
    outputs:
      image-tag: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: app
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
