name: App CI
on:
  push:
    paths:
      - 'app/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r app/src/requirements.txt
      - run: pytest app/src/tests
