kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            register-with-taints: "dedicated=argocd:NoSchedule"
            node-labels: "dedicated=argocd"
  # Dedicated node for the monitoring stack (Prometheus, Grafana, Alertmanager).
  # Mirrors an EKS managed node group labelled+tainted dedicated=monitoring
  # (see infra/eks/monitoring-nodegroup.yaml).
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            register-with-taints: "dedicated=monitoring:NoSchedule"
            node-labels: "dedicated=monitoring"
containerdConfigPatches:
  - |
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://host.docker.internal:5000"]
